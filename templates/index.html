<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketSmart AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="eyebrow">AI-POWERED BUDGET ASSISTANT</div>
      <h1>PocketSmart AI</h1>
      <p>Your Smart Budget & Recommendation Assistant</p>
    </header>

    <section class="card">
      <h2>Create a Budget Plan</h2>
      <form action="/recommend" method="post">
        <label>Planning Category</label>
        <select name="category">
          <option>Home Interior</option>
          <option>Party Planning</option>
          <option>Jewelry Planning</option>
        </select>

        <label>Budget</label>
        <input name="budget" type="number" min="1" step="0.01" required
               placeholder="Enter your budget">

        <label>Preference</label>
        <input name="preference" type="text"
               placeholder="Example: modern, simple, premium">

        <button type="submit">Generate Recommendation</button>
      </form>
    </section>

    {% for item in recommendations %}
<div class="row">
  <span>{{ item.name }}</span>
  <strong>₹ {{ "%.2f"|format(item.amount) }}</strong>
</div>
{% endfor %}

<div class="row">
  <span><strong>Total Budget</strong></span>
  <strong>₹ {{ "%.2f"|format(budget) }}</strong>
</div>

</section>

  </main>
</body>
</html>
